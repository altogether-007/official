    <script>
        let favorites = JSON.parse(localStorage.getItem('altogether_favs')) || [];

        function sortMainContainer() {
            const mainContainer = document.getElementById('main-container');
            const items = Array.from(mainContainer.children);
            items.sort((a, b) => {
                const titleA = a.querySelector('.tool-title').innerText.trim().toUpperCase();
                const titleB = b.querySelector('.tool-title').innerText.trim().toUpperCase();
                return titleA.localeCompare(titleB);
            });
            items.forEach(item => mainContainer.appendChild(item));
        }

        function renderFavorites() {
            const favContainer = document.getElementById('fav-container');
            const favHeading = document.getElementById('fav-heading');
            favContainer.innerHTML = '';
            
            const allItems = document.querySelectorAll('#main-container .directory-item');

            allItems.forEach(item => {
                const id = item.getAttribute('data-id');
                const star = item.querySelector('.fav-star');
                if (favorites.includes(id)) {
                    star.classList.add('active');
                    const clone = item.cloneNode(true);
                    favContainer.appendChild(clone);
                } else {
                    star.classList.remove('active');
                }
            });
            
            favHeading.style.display = favorites.length > 0 ? 'block' : 'none';
        }

        function toggleFav(id) {
            favorites = favorites.includes(id) ? favorites.filter(favId => favId !== id) : [...favorites, id];
            localStorage.setItem('altogether_favs', JSON.stringify(favorites));
            renderFavorites();
        }

        window.addEventListener('DOMContentLoaded', () => {
            sortMainContainer();
            renderFavorites();
        });
    </script>
